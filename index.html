<script>
const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
const PERIODS = [1, 2, 3, 4, 5, 6, 7, 8];
const $ = id => document.getElementById(id);
const esc = x => String(x ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

// ===== إعدادات واتساب (Meta WhatsApp Cloud API) =====
// تُحفظ في متصفح هذا الجهاز فقط (localStorage) ولا تُرسَل مع المزامنة الأونلاين، لأنها بيانات دخول حسّاسة.
// لا يحتاج المستخدم إدخال غير Token و Phone Number ID؛ البقية ثابتة في الكود مطابقة لقالب الرسالة المعتمد.
const WA_TEMPLATE_NAME = 'substitute_period_notification';
const WA_LANG = 'ar';
const WA_COUNTRY = '968';
const waGet = k => localStorage.getItem(k) || '';
const waConfigured = () => !!(waGet('waToken') && waGet('waPhoneId'));
const waMask = v => v ? ('•'.repeat(Math.max(0, v.length - 4)) + v.slice(-4)) : '';

const defaultTeachers = [];

let db = JSON.parse(localStorage.getItem('schoolReserveDB') || 'null') || { teachers: defaultTeachers, s: {}, log: [], cnt: {}, free: {}, schoolScheduleMeta: null };
function normalizeDb() {
  db.teachers = Array.isArray(db.teachers) ? db.teachers : [];
  db.s = db.s && typeof db.s === 'object' ? db.s : {};
  db.log = Array.isArray(db.log) ? db.log : [];
  db.cnt = db.cnt && typeof db.cnt === 'object' ? db.cnt : {};
  db.free = db.free && typeof db.free === 'object' ? db.free : {};
  db.schoolScheduleMeta = db.schoolScheduleMeta || null;
  db.school = db.school && typeof db.school === 'object' ? db.school : {
    ministry: 'وزارة التربية والتعليم',
    name: 'مدرسة التعليم الأساسي',
    logo: ''
  };
  if (db.school.ministry === 'وزارة التربية والتعليم') db.school.ministry = 'وزارة التعليم';
  if (db.school.name === 'مدرسة التعليم الأساسي') db.school.name = 'معولة بن شمس للتعليم الأساسي (5-12)';

  // تنظيف بقايا أسماء تجريبية/افتراضية قديمة كانت محفوظة في المتصفح من إصدار سابق
  // (أسماء مفردة وهمية لا تُطابق أي معلم حقيقي من ملف الإكسل)
  const KNOWN_PLACEHOLDER_NAMES = new Set(['أحمد', 'محمد', 'خالد', 'فيصل', 'سالم', 'عبدالله', 'معلم عام']);
  {
    const before = db.teachers.length;
    db.teachers = db.teachers.filter(t => !KNOWN_PLACEHOLDER_NAMES.has(String(t.name || '').trim()));
    if (db.teachers.length !== before) {
      const keepIds = new Set(db.teachers.map(t => String(t.id)));
      Object.keys(db.cnt).forEach(id => { if (!keepIds.has(String(id))) delete db.cnt[id]; });
      Object.keys(db.s).forEach(k => { if (!keepIds.has(String(k.split('|')[0]))) delete db.s[k]; });
      Object.keys(db.free).forEach(k => { if (!keepIds.has(String(k.split('|')[0]))) delete db.free[k]; });
    }
  }

  db.teachers.forEach(t => { if (t.quota == null) t.quota = 3; if (db.cnt[t.id] == null) db.cnt[t.id] = 0; });

}
normalizeDb();


// ===== الحفظ الأونلاين (Firebase Realtime Database عبر REST) =====
// ضع رابط قاعدة البيانات هنا (أو أدخله من زر "المزامنة الأونلاين" في الشريط الجانبي)
const FIREBASE_DB_URL_DEFAULT = '';
// رابط خاص بمدرستك: أضف في آخر الرابط  #s=الرمز&u=رابط_القاعدة  فيُفعَّل الحفظ الأونلاين تلقائيًا لكل من يفتحه.
// الرمز يبقى في الرابط فقط (وليس داخل الملف)، وبدونه تعمل أي مدرسة أخرى بالحفظ المحلي.
(function readSyncFromLink() {
  try {
    const q = new URLSearchParams((location.hash || '').replace(/^#/, '') || location.search);
    const c = q.get('s'), u = q.get('u');
    if (c) localStorage.setItem('schoolSyncCode', c.trim());
    if (u) localStorage.setItem('schoolSyncUrl', u.trim().replace(/\/+$/, ''));
  } catch (e) {}
})();
const getSyncUrl = () => (localStorage.getItem('schoolSyncUrl') || FIREBASE_DB_URL_DEFAULT || '').trim().replace(/\/+$/, '');
const getSyncCode = () => (localStorage.getItem('schoolSyncCode') || '').trim();
const isScriptUrl = u => /^https:\/\/script\.google\.com\//.test(u);
const cloudEndpoint = () => {
  const u = getSyncUrl(), c = getSyncCode();
  if (!u || !c) return null;
  return isScriptUrl(u) ? u : `${u}/schools/${encodeURIComponent(c)}.json`;
};
function setSyncStatus(kind) {
  const map = {
    local:   ['💾 حفظ محلي (المزامنة غير مفعلة)', 'bg-slate-500'],
    syncing: ['⏳ جارٍ الحفظ أونلاين...', 'bg-amber-400'],
    ok:      ['☁️ محفوظ أونلاين', 'bg-emerald-500'],
    error:   ['⚠️ تعذر الاتصال بالسحابة', 'bg-rose-500'],
  };
  const [txt, cls] = map[kind] || map.local;
  const l = document.getElementById('syncLabel'), d = document.getElementById('syncDot');
  if (l) l.textContent = txt;
  if (d) d.className = 'w-2 h-2 rounded-full animate-pulse ' + cls;
}
let syncTimer = null, syncBusy = false;
async function pushCloud() {
  const url = cloudEndpoint();
  if (!url) { setSyncStatus('local'); return; }
  setSyncStatus('syncing');
  try {
    // نخزن قاعدة البيانات كنص JSON واحد لأن مفاتيح Firebase لا تقبل النقطة وبعض الرموز
    const payload = { updatedAt: db.updatedAt || Date.now(), data: JSON.stringify(db) };
    if (isScriptUrl(url)) {
      // Google Apps Script: طلب بسيط (text/plain) لتجنب مشكلة CORS
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ code: getSyncCode(), ...payload }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'denied');
    } else {
      const r = await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (!r.ok) throw new Error(r.status);
    }
    setSyncStatus('ok');
  } catch (e) { setSyncStatus('error'); }
}
async function pullCloud() {
  const url = cloudEndpoint();
  if (!url || syncBusy) return;
  syncBusy = true;
  try {
    const r = await fetch(isScriptUrl(url) ? `${url}?code=${encodeURIComponent(getSyncCode())}` : url, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const remote = await r.json();
    if (remote && remote.error) throw new Error(remote.error);
    if (!remote || !remote.data) { await pushCloud(); return; }   // أول مرة: ارفع النسخة المحلية
    if ((remote.updatedAt || 0) > (db.updatedAt || 0)) {
      db = JSON.parse(remote.data);
      normalizeDb();
      localStorage.setItem('schoolReserveDB', JSON.stringify(db));
      const busy = !document.getElementById('modal').classList.contains('hidden') ||
                   /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
      if (!busy && window.App) App.page(App._currentPage || 'home');
      setSyncStatus('ok');
    } else if ((remote.updatedAt || 0) < (db.updatedAt || 0)) {
      await pushCloud();
    } else setSyncStatus('ok');
  } catch (e) { setSyncStatus('error'); }
  finally { syncBusy = false; }
}
const save = () => {
  db.updatedAt = Date.now();
  localStorage.setItem('schoolReserveDB', JSON.stringify(db));
  if (cloudEndpoint()) { clearTimeout(syncTimer); syncTimer = setTimeout(pushCloud, 1000); }
};
const key = (id, d, p) => id + '|' + d + '|' + p;
const freeKey = (id, d, p) => id + '|' + d + '|' + p;
const lesson = (id, d, p) => db.s[key(id, d, p)] || { sub: '', cl: '' };
const pad2 = n => String(n).padStart(2, '0');
const localISODate = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const dayNameFromISO = iso => { const [y, m, dd] = String(iso || '').split('-').map(Number); if (!y) return null; const g = new Date(y, m - 1, dd).getDay(); return g <= 4 ? DAYS[g] : null; };
const dmy = iso => { const [y, m, d] = String(iso || '').split('-'); return y ? `${d}-${m}-${y}` : ''; };
// يوم الدراسة السابق فعليًا (يتجاوز عطلة الجمعة/السبت: سابق الأحد هو الخميس الماضي)
const previousSchoolDateISO = iso => {
  const [y, m, dd] = String(iso || '').split('-').map(Number);
  if (!y) return null;
  const idx = DAYS.indexOf(dayNameFromISO(iso));
  const d = new Date(y, m - 1, dd - (idx === 0 ? 3 : 1));
  return localISODate(d);
};
const printDayName = d => d === 'الاثنين' ? 'الإثنين' : d;
const PERIOD_ORDINALS = ['الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة', 'السابعة', 'الثامنة'];
// قواعد الاحتياط
const BREAK_AFTER_PERIOD = 4;   // الفسحة بعد الحصة الرابعة
const MAX_DAILY_LOAD = 5;       // من لديه 5 حصص في اليوم يُستبعد من الاحتياط
const WEEKLY_LAST_PERIOD_LIMIT = 3; // من لديه 3 حصص (فأكثر) في الحصة الثامنة خلال الأسبوع لا يُعطى الحصة الثامنة احتياطًا
const MAX_CONSECUTIVE = 2;      // لا تزيد الحصص المتتالية عن حصتين
const isFreed = (id, d, p) => !!db.free[freeKey(id, d, p)];
const activeTeachers = () => db.teachers.filter(t => t.active);

const SKILL_SUBJECTS = new Set([
  'المهارات الموسيقية',
  'الفنون التشكيلية',
  'الرياضة المدرسية',
  'المهارات الحياتية',
  'تقنية المعلومات',
  'التوجيه المهني'
]);

function teacherLessons(tid) {
  const out = [];
  DAYS.forEach(d => PERIODS.forEach(p => {
    const l = lesson(tid, d, p);
    if (l.sub || l.cl) out.push({day:d, period:p, ...l});
  }));
  return out;
}

function teacherSubjectStats(tid) {
  const counts = {};
  teacherLessons(tid).forEach(l => {
    if (!l.sub) return;
    counts[l.sub] = (counts[l.sub] || 0) + 1;
  });
  return Object.entries(counts).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0], 'ar'));
}

function primarySubject(tid) {
  return teacherSubjectStats(tid)[0]?.[0] || 'غير محدد';
}

// مجموعات المواد التي تُدمج معًا في جدول واحد بمسمى موحّد، مع بقاء اسم المادة الفعلي
// داخل كل حصة كما هو (لا يتغير عرض المادة نفسها، فقط يتغير تجميع/عنوان الجدول).
const SUBJECT_MERGE_GROUPS = [
  { target: 'العلوم', members: ['الكيمياء', 'الفيزياء', 'الاحياء', 'علوم بيئه', 'العلوم'] },
  { target: 'الرياضيات', members: ['الرياضيات', 'الرياضيات الأساسية', 'الرياضيات المتقدمة', 'الرياضيات البحتة'] },
  { target: 'الدراسات الاجتماعية', members: [
      'الدراسات الاجتماعية',
      'الجغرافيا الإقتصادية', 'الجغرافيا الاقتصادية',
      'التاريخ', 'التاريخ(العالم من حولي)', 'التاريخ (العالم من حولي)',
      'التاريخ (الحضارة الإسلامية)', 'التاريخ(الحضارة الإسلامية)'
    ] },
];
function groupSubject(tid) {
  const subj = String(primarySubject(tid) || '').trim();
  const grp = SUBJECT_MERGE_GROUPS.find(g => g.members.includes(subj));
  return grp ? grp.target : subj;
}

function isSkillSubject(subject) {
  return SKILL_SUBJECTS.has(String(subject || '').trim());
}

function subjectOrder() {
  const subjects = [...new Set(db.teachers.map(t => groupSubject(t.id)))]
    .filter(Boolean)
    .sort((a,b) => {
      const sa = isSkillSubject(a), sb = isSkillSubject(b);
      if (sa !== sb) return sa ? 1 : -1;
      return a.localeCompare(b, 'ar');
    });
  return subjects;
}

// أسماء المواد طويلة أحيانًا، فبدل كتابتها داخل كل خلية نستخدم لونًا ثابتًا لكل مادة فعلية
// (نفس اللون دائمًا لنفس المادة)، مع دليل ألوان (Legend) أعلى كل جدول لتوضيح المقصود بكل لون.
const SUBJECT_COLOR_PALETTE = [
  { bg: '#fee2e2', text: '#991b1b' }, { bg: '#ffedd5', text: '#9a3412' },
  { bg: '#fef9c3', text: '#854d0e' }, { bg: '#dcfce7', text: '#166534' },
  { bg: '#ccfbf1', text: '#115e59' }, { bg: '#cffafe', text: '#155e75' },

];
function allActualSubjects() {
  const set = new Set();
  db.teachers.forEach(t => teacherSubjectStats(t.id).forEach(([s]) => set.add(s)));
  return [...set].filter(Boolean).sort((a,b) => a.localeCompare(b, 'ar'));
}
function buildSubjectColorMap() {
  const map = {};
  allActualSubjects().forEach((s, i) => { map[s] = SUBJECT_COLOR_PALETTE[i % SUBJECT_COLOR_PALETTE.length]; });
  return map;
}
function renderSubjectLegend(colorMap, subjects) {
  if (!subjects.length) return '';
  return `<div class="flex flex-wrap gap-2 mb-3">${subjects.map(s => {
    const c = colorMap[s] || { bg: '#e2e8f0', text: '#1e293b' };
    return `<span class="text-[10px] font-bold px-2.5 py-1 rounded-full" style="background:${c.bg};color:${c.text}">${esc(s)}</span>`;
  }).join('')}</div>`;
}

function sharedInfoFor(tid, d, p) {
  const l = lesson(tid, d, p);
  if (!l.cl) return null;
  const ids = db.teachers.filter(t => {
    if (t.id === tid) return false;
    const x = lesson(t.id, d, p);
    return x.cl && x.cl === l.cl;
  }).map(t => t.name);
  return ids.length ? ids : null;
}

  waFormatPhone(raw) {
    let p = this.normalize(raw).replace(/[^\d+]/g, '').replace(/^0+/, '');
    if (p.startsWith('+')) p = p.slice(1);
    if (!p.startsWith(WA_COUNTRY)) p = WA_COUNTRY + p;
    return p;

  // منع إرسال رسالة واتساب أكثر من مرة لنفس المعلم في نفس اليوم ونفس الحصة
  waSentKey(teacherId, isoDate, period) { return `${isoDate}|${period}|${teacherId}`; },
  waAlreadySent(teacherId, isoDate, period) {
    return !!(db.waSentLog && db.waSentLog[this.waSentKey(teacherId, isoDate, period)]);
  },
  waMarkSent(teacherId, isoDate, period) {
    db.waSentLog = db.waSentLog || {};
    db.waSentLog[this.waSentKey(teacherId, isoDate, period)] = Date.now();
    save();
  },

  // يرسل رسالة القالب المعتمد في Meta لمعلم واحد عبر واتساب. isoDate لازم لمنع التكرار لنفس اليوم/الحصة.
  // silent=true تُستخدم في الإرسال الجماعي فلا تعرض تنبيهًا لكل معلم على حدة، وتُعيد حالة الإرسال بدلًا من ذلك.
  async waSendTemplate(teacher, { date, day, period, className, isoDate }, silent) {
    if (!waConfigured()) { if (!silent) this.alert('فعّل إعدادات واتساب أولًا من لوحة التحكم.'); return 'not_configured'; }
    if (!teacher?.phone) { if (!silent) this.alert(`لا يوجد رقم هاتف مسجّل للمعلم «${teacher?.name || ''}». أضفه من قسم «هواتف المعلمين».`); return 'no_phone'; }
    if (isoDate && this.waAlreadySent(teacher.id, isoDate, period)) {
      if (!silent) this.alert(`تم إرسال رسالة واتساب لـ «${teacher.name}» لنفس اليوم ونفس الحصة مسبقًا، ولن تُرسَل مرة أخرى.`);
      return 'already_sent';
    }
    const to = this.waFormatPhone(teacher.phone);
    const params = [teacher.name, date, day, String(period), className || '', db.school?.name || ''];
    const body = {
      messaging_product: 'whatsapp',
      to,
      type: 'template',
      template: {
        name: WA_TEMPLATE_NAME,
        language: { code: WA_LANG },
        components: [{ type: 'body', parameters: params.map(p => ({ type: 'text', text: String(p || '') })) }]
      }
    };
    try {
      const r = await fetch(`https://graph.facebook.com/v19.0/${waGet('waPhoneId')}/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${waGet('waToken')}` },
        body: JSON.stringify(body)
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j?.error?.message || r.status);
      if (isoDate) this.waMarkSent(teacher.id, isoDate, period);
      if (!silent) this.alert(`تم إرسال رسالة واتساب إلى ${teacher.name}.`);
      return 'sent';
    } catch (err) {
      if (!silent) this.alert(`تعذّر إرسال رسالة واتساب إلى ${teacher.name}: ${err.message || err}`);
      return 'error';
    }
  },

  addT() {
    this.openM('إضافة معلم جديد', `

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">اسم المعلم</label>
          <input id="newTeacherName" type="text" placeholder="مثال: أ. محمد أحمد" class="w-full border border-slate-200 rounded-xl p-3 outline-none focus:border-emerald-500 font-medium text-slate-800">
        </div>
        <button onclick="App.confirmAddTeacher()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-3.5 rounded-xl font-semibold shadow-md shadow-emerald-600/20 transition-all">حفظ وإضافة</button>
      </div>
    `);
  },
  confirmAddTeacher() {
    const name = $('newTeacherName')?.value?.trim();
    if (!name) { this.alert('الرجاء إدخال اسم المعلم بشكل صحيح.'); return; }
    const id = Date.now();
    db.teachers.push({ id, name, active: true, quota: 3 });
    db.cnt[id] = 0;
    save();
    this.closeM();
    this.teachers();
  },
  rename(id, n) { const t = db.teachers.find(t => t.id == id); if (t) { t.name = n.trim() || t.name; save(); } },

  openTeacherSchedule(id) {
    this.renderTeacherScheduleModal(id);
  },

  renderTeacherScheduleModal(id) {
    const t = db.teachers.find(x => x.id == id);
    if (!t) return;
    this.openM(`جدول المعلم: ${esc(t.name)}`, `
      <div class="space-y-4">
        <div class="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center bg-slate-50 border border-slate-200 rounded-xl p-3">
          <input id="tsNameInput" value="${esc(t.name)}" class="flex-1 border border-slate-200 rounded-xl p-2.5 outline-none focus:border-emerald-500 font-bold text-slate-800">
          <button onclick="App.saveTeacherScheduleName(${id})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold">حفظ الاسم</button>
        </div>
        <p class="text-xs text-slate-500">اضغط على أي حصة لإضافتها أو تعديلها، أو لحذفها من الجدول.</p>

          <table class="w-full text-[11px] text-right border-collapse">

              <tr class="bg-slate-50 border-b border-slate-200">
                <th class="p-2 sticky right-0 z-10 bg-slate-50 border-l border-slate-200">الحصة</th>
                ${DAYS.map(d => `<th class="p-2 text-center border-l border-slate-200">${d}</th>`).join('')}
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${PERIODS.map(p => `
                <tr>
                  <td class="p-2 font-bold text-center sticky right-0 z-10 bg-white border-l border-slate-200">${p}</td>
                  ${DAYS.map(d => {
                    const l = lesson(id, d, p);
                    const f = isFreed(id, d, p);
                    return `<td class="p-1 border-l border-slate-100 align-top ${f ? 'bg-amber-50/80' : ''}">
                      <button onclick="App.editCellInModal(${id},'${d}',${p})" class="w-full min-w-[70px] min-h-[46px] rounded-lg p-1 hover:bg-emerald-50 text-center">

                      </button>
                    </td>`;
                  }).join('')}
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="flex justify-end">
          <button onclick="App.closeM(); App.page(App._currentPage || 'teachers');" class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 font-semibold">إغلاق</button>
        </div>
      </div>
    `);
  },

  saveTeacherScheduleName(id) {
    const v = $('tsNameInput')?.value?.trim();
    if (!v) { this.alert('الرجاء إدخال اسم صحيح للمعلم.'); return; }
    this.rename(id, v);
    this.page(this._currentPage || 'teachers');
    this.renderTeacherScheduleModal(id);
  },

  editCellInModal(id, d, p) {
    const l = lesson(id, d, p), freed = isFreed(id, d, p);
    const t = db.teachers.find(x => x.id == id);
    this.openM(`تعديل حصة — ${esc(t?.name || '')}`, `
      <div class="text-sm font-semibold text-slate-500 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
        <span class="text-emerald-700">${d}</span> — الحصة ${p}
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">المادة</label>
          <input id="cms" class="w-full border border-slate-200 rounded-xl p-3 outline-none focus:border-emerald-500 font-medium" placeholder="اسم المادة" value="${esc(l.sub)}">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">الفصل / الشعبة</label>
          <input id="cmc" class="w-full border border-slate-200 rounded-xl p-3 outline-none focus:border-emerald-500 font-medium" placeholder="مثال: 11/5" value="${esc(l.cl || l.cls || '')}">
        </div>
        <label class="flex items-center gap-3 p-3 bg-amber-50/50 border border-amber-200/60 rounded-xl cursor-pointer">
          <input id="cmf" type="checkbox" ${freed ? 'checked' : ''} class="w-4 h-4 accent-amber-600 rounded">
          <span class="text-sm font-semibold text-amber-900">تفريغ المعلم في هذه الحصة (استثناء من الاحتياط)</span>
        </label>
        <div class="flex gap-3">
          <button onclick="App.saveCellInModal(${id},'${d}',${p})" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white p-3.5 rounded-xl font-semibold shadow-md shadow-emerald-600/20 transition-all">حفظ</button>
          ${l.sub || l.cl ? `<button onclick="App.deleteCellInModal(${id},'${d}',${p})" class="px-5 rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50 font-semibold">🗑️ حذف الحصة</button>` : ''}

        </div>

  saveCellInModal(id, d, p) {
    const sub = $('cms')?.value.trim() || '';
    const cl = $('cmc')?.value.trim() || '';
    if (sub || cl) db.s[key(id, d, p)] = { ...(db.s[key(id, d, p)] || {}), sub, cl }; else delete db.s[key(id, d, p)];
    if ($('cmf')?.checked) db.free[freeKey(id, d, p)] = true; else delete db.free[freeKey(id, d, p)];
    save();
    this.page(this._currentPage || 'teachers');
    this.renderTeacherScheduleModal(id);
  },

  deleteCellInModal(id, d, p) {
    delete db.s[key(id, d, p)];
    delete db.free[freeKey(id, d, p)];
    save();
    this.page(this._currentPage || 'teachers');
    this.renderTeacherScheduleModal(id);
  },

  setQuota(id, v) { const t = db.teachers.find(t => t.id == id); if (t) { t.quota = Math.max(0, +v || 0); save(); } },
  toggle(id, v) { const t = db.teachers.find(t => t.id == id); if (t) { t.active = v; save(); } },

    this.confirm('هل أنت متأكد من حذف هذا المعلم نهائياً؟ سيتم حذف جميع حصصه المسجّلة في الجدول العام أيضًا.', () => {
      db.teachers = db.teachers.filter(t => t.id != id);

      if (db.schoolScheduleMeta) db.schoolScheduleMeta.teachers = db.teachers.length;
      save();
      this.page(this._currentPage || 'teachers');

  // استيراد أرقام هواتف المعلمين من ملف إكسل (عمود اسم + عمود رقم هاتف)، ومطابقتها بالاسم مع المعلمين الحاليين
  importTeacherPhones(input) {
    const file = input.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
        const normName = s => this.normalize(s).replace(/\s+/g, '');
        const byName = {};
        db.teachers.forEach(t => { byName[normName(t.name)] = t; });

        let matched = 0, unmatched = [];
        rows.forEach(row => {
          const cells = row.map(c => this.normalize(c)).filter(Boolean);
          if (cells.length < 2) return;
          // العمود الذي يحوي أرقامًا كثيرة هو الهاتف، والآخر هو الاسم
          const phoneCell = cells.find(c => (c.match(/\d/g) || []).length >= 6);
          const nameCell = cells.find(c => c !== phoneCell && !/^\d+$/.test(c));
          if (!phoneCell || !nameCell) return;
          const phone = phoneCell.replace(/[^\d+]/g, '');
          const t = byName[normName(nameCell)];
          if (t) { t.phone = phone; matched++; } else { unmatched.push(nameCell); }
        });

        save();
        this.page(this._currentPage || 'teachers');
        this.alert(`تم استيراد ${matched} رقم هاتف بنجاح.` + (unmatched.length ? ` تعذّر مطابقة ${unmatched.length} اسم غير موجود في قائمة المعلمين.` : ''));
      } catch (err) {
        this.alert('تعذّرت قراءة ملف الهواتف. تأكد أنه يحتوي عمودين: اسم المعلم ورقم الهاتف.');
      }
      input.value = '';
    };
    reader.readAsArrayBuffer(file);
  },

  async readXmlFile(input) {
    const file = input.files?.[0];
    if (!file) return;
    const status = $('importStatus');
    status.innerHTML = '<div class="p-4 rounded-2xl bg-indigo-50 border">📄 جاري تحليل ملف XML (aSc Timetables)...</div>';

    try {
      const text = await file.text();
      const xml = new DOMParser().parseFromString(text, 'text/xml');
      if (xml.querySelector('parsererror')) throw new Error('ملف XML غير صالح أو تالف.');

      const teachers = {};
      xml.querySelectorAll('teacher').forEach(t => {
        const id = t.getAttribute('id');
        const name = t.getAttribute('name') || t.getAttribute('short') || t.getAttribute('fullname') || t.textContent.trim();
        if (id) teachers[id] = name || id;
      });

      const subjects = {};
      xml.querySelectorAll('subject').forEach(s => {
        const id = s.getAttribute('id');
        const name = s.getAttribute('name') || s.getAttribute('short') || s.textContent.trim();
        if (id) subjects[id] = name || id;
      });

      const classes = {};
      xml.querySelectorAll('class').forEach(c => {
        const id = c.getAttribute('id');
        const name = c.getAttribute('name') || c.getAttribute('short') || c.textContent.trim();
        if (id) classes[id] = name || id;
      });

      const daysList = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
      const daysdefs = {};
      xml.querySelectorAll('daysdef').forEach(d => {
        daysdefs[d.getAttribute('id')] = d.getAttribute('days');
      });

      const lessons = {};
      xml.querySelectorAll('lesson').forEach(l => {
        const id = l.getAttribute('id');
        // Handle teacherids, teacher, teacherid
        let teacherids = [];
        const tRaw = l.getAttribute('teacherids') || l.getAttribute('teacher') || l.getAttribute('teacherid') || '';
        teacherids.push(...tRaw.split(/[, ;]+/).map(x => x.trim()).filter(Boolean));
        l.querySelectorAll('teacherid, teacher').forEach(e => {
          const v = (e.getAttribute('id') || e.textContent || '').trim();
          if (v) teacherids.push(...v.split(/[, ;]+/).filter(Boolean));
        });
        teacherids = [...new Set(teacherids)];

        const subjectid = l.getAttribute('subjectid') || l.getAttribute('subject') ||
          l.querySelector('subjectid, subject')?.textContent?.trim();

        let classids = [];
        const cRaw = l.getAttribute('classids') || l.getAttribute('class') || l.getAttribute('classid') || '';
        classids.push(...cRaw.split(/[, ;]+/).map(x => x.trim()).filter(Boolean));
        l.querySelectorAll('classid, class').forEach(e => {
          const v = (e.getAttribute('id') || e.textContent || '').trim();
          if (v) classids.push(...v.split(/[, ;]+/).filter(Boolean));
        });
        classids = [...new Set(classids)];
        const daysdefid = l.getAttribute('daysdefid');
        const periodsStr = l.getAttribute('periods') || l.getAttribute('period');
        lessons[id] = { teacherids, subjectid, classids, daysdefid, periodsStr };
      });

      const rows = [];

      const cards = xml.querySelectorAll('card');
      if (cards.length > 0) {
        cards.forEach(card => {
          const lessonid = card.getAttribute('lessonid') || card.getAttribute('lesson');
          const dayIndex = Number(card.getAttribute('day') ?? card.getAttribute('dayid') ?? 0);
          const period = Number(card.getAttribute('period') ?? card.getAttribute('periodid') ?? 1);
          const l = lessons[lessonid];
          if (l) {
            const sub = subjects[l.subjectid] || 'اسم المادة';
            const cl = l.classids.map(cid => classes[cid] || cid).join(' / ');
            const dayName = daysList[dayIndex] || DAYS[dayIndex % 5];
            l.teacherids.forEach(tid => {
              const teacherName = teachers[tid] || tid;
              if (teacherName) {
                rows.push({
                  teacher: teacherName,
                  day: dayName,
                  period: period > 0 ? period : 1,
                  sub,
                  cl
                });
              }
            });
          }
        });
      }

      if (rows.length === 0) {
        Object.values(lessons).forEach(l => {
          const sub = subjects[l.subjectid] || 'اسم المادة';
          const cl = l.classids.map(cid => classes[cid] || cid).join(' / ');
          const daysMask = daysdefs[l.daysdefid] || '11111';
          
          const activePeriods = [];
          if (l.periodsStr) {
            [...l.periodsStr].forEach((char, idx) => {
              if (char === '1' || char === 'x' || char === 'X') activePeriods.push(idx + 1);
            });
          }
          if (activePeriods.length === 0) activePeriods.push(1);

          [...daysMask].forEach((char, dayIdx) => {
            if (char === '1') {
              const dayName = daysList[dayIdx] || DAYS[dayIdx % 5];
              activePeriods.forEach(p => {
                l.teacherids.forEach(tid => {
                  const teacherName = teachers[tid] || tid;
                  if (teacherName) {
                    rows.push({
                      teacher: teacherName,
                      day: dayName,
                      period: p,
                      sub,
                      cl
                    });
                  }
                });
              });
            }
          });
        });
      }

      if (rows.length === 0) {
        throw new Error('لم يتم العثور على حصص دراسية مطابقة في ملف XML.');
      }

      window.pendingSchoolRows = rows;
      const teacherCount = [...new Set(rows.map(x => x.teacher))].length;

      status.innerHTML = `
        <div class="border border-emerald-200 bg-emerald-50/80 rounded-2xl p-5">
          <b class="text-emerald-900 text-lg block mb-1">✅ تمت قراءة ملف XML (${rows.length} حصة) بنجاح!</b>
          <div class="text-sm text-emerald-800 mb-4">عدد المعلمين المكتشفين: <span class="font-bold">${teacherCount}</span></div>
          <div class="flex gap-3">
            <button onclick="App.confirmSchoolImport()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow-md transition-all">اعتماد وحفظ الجدول</button>
            <button onclick="App.cancelSchoolImport()" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 px-5 py-2.5 rounded-xl font-semibold transition-all">إلغاء</button>
          </div>
        </div>
      `;
      this.renderImportPreview(rows.slice(0, 40));

    } catch (err) {
      console.error(err);
      status.innerHTML = `<div class="p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 font-medium">❌ تعذر قراءة ملف XML: ${esc(err.message)}</div>`;
    }
  },

  async readPdfFile(input) {
    const file = input.files?.[0];
    if (!file) return;

    const status = $('importStatus');
    status.innerHTML = '<div class="p-4 rounded-2xl bg-indigo-50 border border-indigo-200 font-medium text-indigo-800">📄 جاري تحليل صفحات PDF واستخراج جدول كل معلم...</div>';

    try {
      if (typeof pdfjsLib === 'undefined') {
        throw new Error('مكتبة قراءة PDF لم تُحمّل. افتح الملف مع اتصال بالإنترنت ثم حاول مرة أخرى.');
      }

      const arrayBuffer = await file.arrayBuffer();
      const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const parsed = [];
      let scannedTextItems = 0;

      for (let pageNo = 1; pageNo <= pdfDoc.numPages; pageNo++) {
        const page = await pdfDoc.getPage(pageNo);
        const viewport = page.getViewport({ scale: 1 });
        const textContent = await page.getTextContent();

        const items = textContent.items
          .filter(it => (it.str || '').trim())
          .map(it => {
            const x = it.transform[4];
            const yTop = viewport.height - it.transform[5];
            const width = Math.abs(it.width || 0);
            return {
              str: (it.str || '').trim(),
              x,
              y: yTop,
              cx: x + width / 2,
              width
            };
          });

        scannedTextItems += items.length;
        parsed.push(...this.parseAScPdfPage(items, viewport.width, viewport.height, pageNo));
      }

      const unique = [];
      const seen = new Set();
      parsed.forEach(r => {
        const k = [r.teacher, r.day, r.period, r.cl, r.sub].join('|');
        if (!seen.has(k)) {
          seen.add(k);
          unique.push(r);
        }
      });

      if (!unique.length) {
        throw new Error(`تم فتح PDF بنجاح (${pdfDoc.numPages} صفحات و${scannedTextItems} عنصر نصي)، لكن لم يتم التعرف على شبكات aSc. أعد رفع ملف الجدول الأصلي.`);
      }

      const teacherCount = [...new Set(unique.map(x => x.teacher))].length;
      if (teacherCount < 2) {
        throw new Error(`تم التعرف على ${teacherCount} معلم فقط؛ لم يتم اعتماد القراءة.`);
      }

      window.pendingSchoolRows = unique;

      status.innerHTML = `
        <div class="border border-indigo-200 bg-indigo-50/80 rounded-2xl p-5">
          <b class="text-indigo-900 text-lg block mb-1">✅ تمت قراءة الجدول العام من PDF</b>
          <div class="grid sm:grid-cols-3 gap-3 text-sm text-indigo-900 mt-3">
            <div class="bg-white/70 rounded-xl p-3"><b>${teacherCount}</b><br>معلم مكتشف</div>
            <div class="bg-white/70 rounded-xl p-3"><b>${unique.length}</b><br>حصة فعلية مكتشفة</div>
            <div class="bg-white/70 rounded-xl p-3"><b>${pdfDoc.numPages}</b><br>صفحات PDF</div>
          </div>
          <p class="text-xs text-indigo-700 mt-3">تمت قراءة كل شبكة معلم مستقلة وربطها باليوم والحصة والفصل والمادة. راجع المعاينة قبل الاعتماد.</p>
          <div class="flex gap-3 mt-4">
            <button onclick="App.confirmSchoolImport()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow-md transition-all">اعتماد وحفظ الجدول</button>
            <button onclick="App.cancelSchoolImport()" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 px-5 py-2.5 rounded-xl font-semibold transition-all">إلغاء</button>
          </div>
        </div>`;
      this.renderImportPreview(unique.slice(0, 80));
    } catch (err) {
      console.error(err);
      status.innerHTML = `<div class="p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 font-medium">❌ تعذر قراءة ملف PDF: ${esc(err.message)}</div>`;
    }
  },

  parseAScPdfPage(items, pageWidth, pageHeight, pageNo) {
    const out = [];
    const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
    const classRe = /^\d{1,2}\s*\/\s*\d{1,2}$/;
    const periodRe = /^[1-8]$/;

    const clean = s => String(s || '')
      .replace(/\uFDF2/g,'الله')
      .replace(/\uFEF2/g,'الله')
      .replace(/\s+/g,' ')
      .trim();

    const normalizeClass = s => clean(s).replace(/\s+/g,'');
    const isArabic = s => /[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/.test(s || '');

    const fixName = s => clean(s)
      .replace(/ه\s*ﻼل|ه\s*ل/g,'هلال')
      .replace(/عبد\s*ﷲ|عبد\s*الله/g,'عبدالله')
      .replace(/\s+/g,' ')
      .trim();

    const fixSubject = s => {
      const x = clean(s);
      if (/التربية.*اسلامية|التربية.*إسلامية/i.test(x)) return 'التربية الإسلامية';
      if (/اللغة.*العربية/i.test(x)) return 'اللغة العربية';
      if (/اللغة.*انجليزية|اللغة.*إنجليزية/i.test(x)) return 'اللغة الإنجليزية';
      if (/الدراسات.*اجتماعية|الدراسات.*إجتماعية/i.test(x)) return 'الدراسات الاجتماعية';
      return x;
    };

    const its = (items || []).map((it, idx) => ({
      i: idx,
      str: clean(it.str),
      x: Number(it.x) || 0,
      y: Number(it.y) || 0,
      cx: Number(it.cx) || ((Number(it.x)||0) + (Number(it.width)||0)/2),
      width: Number(it.width) || 0
    })).filter(x => x.str);

    const rowHeight = pageHeight / 3;
    const arabicGroups = [];
    its.filter(x => isArabic(x.str)).forEach(it => {
      let g = arabicGroups.find(z => Math.abs(z.y - it.y) <= 1.5);
      if (!g) {
        g = { y: it.y, items: [] };
        arabicGroups.push(g);
      }
      g.items.push(it);
    });

    const titleGroups = [];
    for (let r = 0; r < 3; r++) {
      const target = r * rowHeight + 10;
      const candidates = arabicGroups
        .filter(g => Math.abs(g.y - target) < 14 && g.items.length >= 2)
        .sort((a,b) => Math.abs(a.y-target) - Math.abs(b.y-target));
      if (candidates[0]) titleGroups.push(candidates[0]);
    }

    if (titleGroups.length < 3) {
      arabicGroups
        .filter(g => g.items.length >= 2)
        .sort((a,b) => a.y-b.y)
        .forEach(g => {
          const r = Math.floor(g.y / rowHeight);
          if (r >= 0 && r < 3 && g.y < r*rowHeight + 28 && !titleGroups.some(x=>Math.abs(x.y-g.y)<5)) {
            titleGroups.push(g);
          }
        });
      titleGroups.sort((a,b)=>a.y-b.y);
    }

    titleGroups.slice(0,3).forEach(titleGroup => {
      const titleY = titleGroup.y;

      for (let col = 0; col < 3; col++) {
        const left = col * (pageWidth/3);
        const right = (col+1) * (pageWidth/3);

        const nameItems = titleGroup.items
          .filter(it => it.x >= left-2 && it.x <= right+2)
          .sort((a,b)=>b.x-a.x);

        let teacher = fixName(nameItems.map(x=>x.str).join(' '));
        if (!teacher || teacher.length < 3) continue;

        if (/ALBATINAH|MAWALAH|SHAMS|Timetables|الجدول|إنشاء/i.test(teacher)) continue;

        const periodItems = its.filter(it =>
          it.x >= left-2 && it.x <= right+2 &&
          it.y > titleY + 10 && it.y < titleY + 34 &&
          periodRe.test(it.str)
        );

        const periodCenters = periodItems
          .sort((a,b)=>a.cx-b.cx)
          .map(it=>({p:+it.str,cx:it.cx}));

        const uniquePeriods = [];
        periodCenters.forEach(x=>{if(!uniquePeriods.some(y=>y.p===x.p))uniquePeriods.push(x)});
        uniquePeriods.sort((a,b)=>a.p-b.p);
        if (uniquePeriods.length < 8) {
          const gridWidth = right-left;
          const fallback = [];
          for(let p=1;p<=8;p++) fallback.push({p,cx:right-gridWidth*((p-0.5)/8)});
          uniquePeriods.length = 0;
          fallback.forEach(x=>uniquePeriods.push(x));
        }

        const cells = its.filter(it =>
          it.x >= left-2 && it.x <= right+2 &&
          it.y > titleY + 30 && it.y < titleY + rowHeight - 8 &&
          classRe.test(normalizeClass(it.str))
        );

        cells.forEach(cell => {
          const rowCandidates = [];
          for(let d=0; d<5; d++){
            rowCandidates.push(titleY + 42 + d*30.4);
          }
          let dayIndex = 0, best = Infinity;
          rowCandidates.forEach((cy,idx)=>{
            const dist=Math.abs(cell.y-cy);
            if(dist<best){best=dist;dayIndex=idx;}
          });

          let period = 1, pbest = Infinity;
          uniquePeriods.forEach(q=>{
            const dist=Math.abs(cell.cx-q.cx);
            if(dist<pbest){pbest=dist;period=q.p;}
          });

          const className = normalizeClass(cell.str);

          const subjectItems = its.filter(it =>
            it.x >= left-2 && it.x <= right+2 &&
            Math.abs(it.y - (cell.y-9.7)) <= 3.8 &&
            !classRe.test(normalizeClass(it.str)) &&
            !/^(الأحد|الاثنين|الثلاثاء|الأربعاء|الخميس|الفسحة|حد|ثنين|ثاء|ربعاء|ا)$/.test(it.str)
          );

          const sortedCenters = uniquePeriods.slice().sort((a,b)=>a.cx-b.cx);
          const pos = Math.max(0, sortedCenters.findIndex(q=>q.p===period));
          const thisCenter = sortedCenters[pos]?.cx ?? cell.cx;
          const leftBound = pos===0
            ? thisCenter - 18
            : (sortedCenters[pos-1].cx + thisCenter)/2;
          const rightBound = pos===sortedCenters.length-1
            ? thisCenter + 18
            : (thisCenter + sortedCenters[pos+1].cx)/2;

          const subject = fixSubject(
            subjectItems
              .filter(it=>it.cx>=Math.min(leftBound,rightBound)-3 && it.cx<=Math.max(leftBound,rightBound)+3)
              .sort((a,b)=>a.x-b.x)
              .map(it=>it.str)
              .join(' ')
          );

          out.push({
            teacher,
            day: DAYS[dayIndex],
            period,
            sub: subject || 'اسم المادة',
            cl: className,
            page: pageNo
          });
        });
      }
    });

    return out;
  },

  readSchoolFile(input) {
    const file = input.files?.[0];
    if (!file) return;
    const status = $('importStatus');
    status.innerHTML = '<div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 font-medium text-slate-600">جاري قراءة ملف Excel وتحليل البيانات...</div>';
    const r = new FileReader();
    r.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        
        let allParsedRows = [];

        // أولاً: حاول التعرف على تصدير aSc الكامل (شيت "الحصص" + أوراق المواد المنتهية بنقطة)
        // ويُنتج فقط: المعلم + اليوم + الحصة (1-8) + المادة، ويتجاهل الفصول/الغرف/باقي الأوراق.
        const ascRows = this.parseAscTeacherWorkbook(wb);
        if (ascRows && ascRows.length) {
          allParsedRows = ascRows;
        }

        if (!allParsedRows.length) {
          wb.SheetNames.forEach(sheetName => {
            const ws = wb.Sheets[sheetName];
            const rawRows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            const sheetParsed = this.parseExcelMatrixOrTable(rawRows);
            if (sheetParsed && sheetParsed.length > 0) {
              allParsedRows.push(...sheetParsed);
            }
          });
        }

        if (!allParsedRows.length) {
          const firstSheet = wb.Sheets[wb.SheetNames[0]];
          const jsonRows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
          allParsedRows = this.parseSchoolRows(jsonRows);
        }

        if (!allParsedRows.length) {
          throw Error('تعذر التعرف على هيكل جدول المعلمين في ملف Excel. تأكد من وجود اسم المعلم، الأيام، الحصص والمواد والفصول.');
        }

        window.pendingSchoolRows = allParsedRows;
        status.innerHTML = `
          <div class="border border-emerald-200 bg-emerald-50/80 rounded-2xl p-5">
            <b class="text-emerald-900 text-lg block mb-1">✨ تمت قراءة ${allParsedRows.length} حصة من ملف Excel بنجاح!</b>
            <div class="text-sm text-emerald-800 mb-4">عدد المعلمين المكتشفين: <span class="font-bold">${[...new Set(allParsedRows.map(x => x.teacher))].length}</span></div>
            <div class="flex gap-3">
              <button onclick="App.confirmSchoolImport()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow-md transition-all">اعتماد وحفظ الجدول</button>
              <button onclick="App.cancelSchoolImport()" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 px-5 py-2.5 rounded-xl font-semibold transition-all">إلغاء</button>
            </div>
          </div>
        `;
        this.renderImportPreview(allParsedRows.slice(0, 40));
      } catch (err) {
        console.error(err);
        status.innerHTML = `<div class="p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 font-medium">❌ تعذر قراءة ملف Excel: ${esc(err.message)}</div>`;
      }
    };
    r.readAsArrayBuffer(file);
  },

  // تصدير aSc الكامل: يحتوي على شيت "الحصص" (المعلم/الشعبة/المادة) + شيت لكل مادة
  // (اسم الشيت = اسم المادة + نقطة) يسرد لكل يوم/حصة الشعب التي تُدرَّس فيها هذه المادة.
  // بما أن كل (شعبة + مادة) مرتبطة بمعلم واحد فقط، نبني: (شعبة+مادة) -> معلم من "الحصص"،
  // ثم نمر على كل شيتات المواد لتحديد يوم/حصة كل معلم، ونتجاهل كل شيء آخر (الغرف، الفصول،
  // شيتات "المعلمون المتاحون"، إلخ) كما طلب المستخدم.
  // "الحادي عشر أساسي/5" -> "11/5" (للطباعة فقط، ولا يفعّل مؤشر الحصص المشتركة)
  shortClass(name) {
    const s = String(name || '').replace(/\s+/g, '');
    const grades = [['الحاديعشر', 11], ['الثانيعشر', 12], ['العاشر', 10], ['التاسع', 9], ['الثامن', 8], ['السابع', 7], ['السادس', 6], ['الخامس', 5], ['الرابع', 4], ['الثالث', 3], ['الثاني', 2], ['الأول', 1]];
    const sec = s.match(/\/(\d+)$/);
    const g = grades.find(([w]) => s.startsWith(w));
    return g && sec ? `${g[1]}/${sec[1]}` : s;
  },

  parseAscTeacherWorkbook(wb) {
    if (!wb.SheetNames.includes('الحصص')) return null;
    const subjectSheetNames = wb.SheetNames.filter(n => n.trim().endsWith('.'));
    if (!subjectSheetNames.length) return null;

    const hososRows = XLSX.utils.sheet_to_json(wb.Sheets['الحصص'], { header: 1, defval: '' });
    const classSubjTeacher = {};
    const subjectsFromHosos = new Set();
    hososRows.forEach((row, idx) => {
      if (idx === 0) return; // رأس الجدول: المعلم / الشعب / المجموعة / المادة ...
      // خلية المعلم قد تحوي أكثر من معلم مفصولين بفاصلة (تدريس مشترك، مثل التوجيه المهني) -
      // نفصلهم إلى معلمين حقيقيين مستقلين بدل معاملتهم كاسم واحد مركّب/جدول مشترك.
      const teacherNames = this.normalize(row[0])
        .split(/[,،]/)
        .map(n => n.trim())
        .filter(Boolean);
      const cls = this.normalize(row[1]).replace(/\s+/g, '');
      const subj = this.normalize(row[3]);
      if (!teacherNames.length || !cls || !subj) return;
      const key = cls + '|' + subj;
      (classSubjTeacher[key] ||= []);
      teacherNames.forEach(teacher => {
        // نفس المعلم قد يتكرر بمدد مختلفة (مفردة/مزدوجة) لنفس الشعبة والمادة - لا نكرره
        if (!classSubjTeacher[key].includes(teacher)) classSubjTeacher[key].push(teacher);
      });
      subjectsFromHosos.add(subj);
    });
    if (!Object.keys(classSubjTeacher).length) return null;

    // اربط كل اسم مادة بشيتها (مع معالجة أسماء الشيتات المبتورة بسبب حد إكسل 31 حرفًا)
    const sheetForSubject = {};
    subjectsFromHosos.forEach(subj => {
      const exact = subj + '.';
      if (subjectSheetNames.includes(exact)) { sheetForSubject[subj] = exact; return; }
      for (const sn of subjectSheetNames) {
        const stripped = sn.replace(/\.$/, '').replace(/\d+$/, '');
        if (stripped.length > 3 && subj.startsWith(stripped)) { sheetForSubject[subj] = sn; return; }
      }
    });

    const out = [];
    Object.entries(sheetForSubject).forEach(([subject, sheetName]) => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
      rows.forEach(row => {
        let dayIdx = -1, day = '';
        for (let i = 0; i < row.length; i++) {
          const d = this.normalizeDay(row[i]);
          if (d) { dayIdx = i; day = d; break; }
        }
        if (dayIdx === -1) return;
        const period = this.normalizePeriod(row[dayIdx + 1]);
        if (!period || period < 1 || period > 8) return;
        for (let i = dayIdx + 2; i < row.length; i++) {
          const cls = this.normalize(row[i]).replace(/\s+/g, '');
          if (!cls) continue;
          // قد تكون الحصة مشتركة بين أكثر من معلم لنفس الشعبة/المادة (تدريس مشترك) -
          // ننزل الحصة لكل معلم منهم بدلًا من الاحتفاظ بمعلم واحد فقط.
          const teacherList = classSubjTeacher[cls + '|' + subject];
          if (teacherList) teacherList.forEach(teacher => out.push({ teacher, day, period, sub: subject, cl: '', cls: this.shortClass(cls) }));
        }
      });
    });

    return out.length ? out : null;
  },

  parseExcelMatrixOrTable(matrix) {
    if (!matrix || matrix.length === 0) return [];
    const out = [];
    let currentTeacher = '';
    let dayMapping = {};
    let periodCols = {};

    for (let r = 0; r < matrix.length; r++) {
      const row = matrix[r];
      if (!row || row.length === 0) continue;
      const rowStr = row.map(c => String(c ?? '').trim()).join(' ');
      if (!rowStr) continue;

      for (let c = 0; c < row.length; c++) {
        const val = String(row[c] || '').trim();
        if (!val) continue;
        
        if (val.length >= 3 && !/^(الحصة|اليوم|الأحد|الاثنين|الثلاثاء|الأربعاء|الخميس|1|2|3|4|5|6|7|8|\d+\/\d+)/i.test(val)) {
          if (!['المعلم', 'المادة', 'الفصل', 'اليوم', 'الحصة'].includes(val)) {
            currentTeacher = val;
          }
        }

        const normalizedVal = val.toLowerCase();
        for (const d of DAYS) {
          if (normalizedVal.includes(d.toLowerCase())) {
            dayMapping[r] = d;
          }
        }

        if (/^[1-8]$/.test(val)) {
          periodCols[+val] = c;
        }
      }

      for (let c = 0; c < row.length; c++) {
        const cellVal = String(row[c] || '').trim();
        if (!cellVal) continue;

        const classMatch = cellVal.match(/^(\d{1,2}\s*\/\s*\d{1,2})$/);
        if (classMatch && currentTeacher) {
          let period = 1;
          for (const [pNum, pCol] of Object.entries(periodCols)) {
            if (Math.abs(pCol - c) <= 2) {
              period = +pNum;
              break;
            }
          }
          let day = 'الأحد';
          for (let prevR = r; prevR >= Math.max(0, r - 6); prevR--) {
            if (dayMapping[prevR]) {
              day = dayMapping[prevR];
              break;
            }
          }
          let sub = 'اسم المادة';
          if (c > 0 && String(row[c-1]).trim() && !/^\d+$/.test(String(row[c-1]))) {
            sub = String(row[c-1]).trim();
          }

          out.push({
            teacher: currentTeacher,
            day: day,
            period: period,
            sub: sub,
            cl: classMatch[1].replace(/\s+/g, '')
          });
        }
      }
    }

    if (out.length === 0) {
      for (let r = 0; r < matrix.length; r++) {
        const row = matrix[r];
        if (row.length >= 4) {
          let tName = '', dName = '', pNum = 1, sName = 'اسم المادة', cName = '';
          row.forEach(cell => {
            const val = String(cell || '').trim();
            if (!tName && val.length > 3 && /[\u0600-\u06FF]/.test(val) && !DAYS.some(d => val.includes(d))) {
              tName = val;
            } else if (!dName) {
              for (const d of DAYS) if (val.includes(d)) dName = d;
            } else if (!pNum && /^[1-8]$/.test(val)) {
              pNum = +val;
            } else if (/^\d{1,2}\s*\/\s*\d{1,2}$/.test(val)) {
              cName = val;
            }
          });
          if (tName && dName && cName) {
            out.push({ teacher: tName, day: dName, period: pNum || 1, sub: sName, cl: cName });
          }
        }
      }
    }

    return out;
  },

  cancelSchoolImport() {
    window.pendingSchoolRows = null;
    $('importStatus').innerHTML = '';
    this.renderSchoolPreview();
  },

  parseSchoolRows(rows) {
    if (!rows.length) throw Error('الملف لا يحتوي على بيانات.');
    const hs = Object.keys(rows[0]).map(this.normalize);
    const ti = this.findHeader(hs, ['المعلم', 'اسم المعلم', 'teacher', 'name']),
          di = this.findHeader(hs, ['اليوم', 'day']),
          pi = this.findHeader(hs, ['الحصة', 'رقم الحصة', 'period', 'lesson']),
          si = this.findHeader(hs, ['المادة', 'subject']),
          ci = this.findHeader(hs, ['الفصل', 'الصف', 'الشعبة', 'class', 'grade']);

    if (ti >= 0 && di >= 0 && pi >= 0) {
      return rows.map(r => {
        const v = Object.values(r);
        return { teacher: this.normalize(v[ti]), day: this.normalizeDay(v[di]), period: this.normalizePeriod(v[pi]), sub: si >= 0 ? this.normalize(v[si]) : 'اسم المادة', cl: ci >= 0 ? this.normalize(v[ci]) : '' };
      }).filter(x => x.teacher && x.day && x.period);
    }
    const tcol = ti >= 0 ? ti : 0, out = [];
    rows.forEach(r => {
      const v = Object.values(r), teacher = this.normalize(v[tcol]);
      if (!teacher) return;
      hs.forEach((h, i) => {
        if (i === tcol) return;
        const d = this.normalizeDay(h), p = this.normalizePeriod(h), raw = this.normalize(v[i]);
        if (d && p && raw) {
          let sub = raw, cl = '';
          const z = raw.split(/\s*[-|/]\s*/);
          if (z.length > 1) { sub = z[0]; cl = z.slice(1).join(' - '); }
          out.push({ teacher, day: d, period: p, sub: sub || 'اسم المادة', cl });
        }
      });
    });
    return out;
  },

  normalize(v) { return String(v ?? '').replace(/\s+/g, ' ').trim(); },
  normalizeDay(v) {
    const s = this.normalize(v), m = { 'الأحد': 'الأحد', 'الاحد': 'الأحد', 'Sunday': 'الأحد', 'الاثنين': 'الاثنين', 'الإثنين': 'الاثنين', 'Monday': 'الاثنين', 'الثلاثاء': 'الثلاثاء', 'Tuesday': 'الثلاثاء', 'الأربعاء': 'الأربعاء', 'الاربعاء': 'الأربعاء', 'Wednesday': 'الأربعاء', 'الخميس': 'الخميس', 'Thursday': 'الخميس' };
    if (m[s]) return m[s];
    for (const d of DAYS) if (s.includes(d)) return d;
    return '';
  },
  normalizePeriod(v) { const m = this.normalize(v).match(/[1-8]/); return m ? +m[0] : null; },
  findHeader(hs, words) { return hs.findIndex(h => words.some(w => this.normalize(h).toLowerCase().includes(w))); },

  confirmSchoolImport() {
    if (!window.pendingSchoolRows?.length) return;
    this.importParsedRows(window.pendingSchoolRows);
    window.pendingSchoolRows = null;
    $('importStatus').innerHTML = '<div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-900 font-semibold">✨ تم اعتماد الجدول العام وحفظه محليًا بنجاح!</div>';
    this.renderSchoolPreview();
  },

  importParsedRows(rows) {
    db.s = {};

    const map = {};
    db.teachers.forEach(t => map[this.normalize(t.name)] = t);

    const sharedMap = {};
    rows.forEach(x => {
      const k = `${x.day}|${x.period}|${this.normalize(x.cl)}`;
      if (x.cl) {
        if (!sharedMap[k]) sharedMap[k] = new Set();
        sharedMap[k].add(x.teacher);
      }
    });

    rows.forEach(x => {
      let t = map[this.normalize(x.teacher)];
      if (!t) {
        t = { id: Date.now() + Math.random(), name: x.teacher, active: true, quota: 3 };
        db.teachers.push(t);
        db.cnt[t.id] = 0;
        map[this.normalize(x.teacher)] = t;
      }

      const sharedKey = `${x.day}|${x.period}|${this.normalize(x.cl)}`;
      const sharedTeachers = x.cl ? [...(sharedMap[sharedKey] || [])].filter(n => n !== x.teacher) : [];

      db.s[key(t.id, x.day, x.period)] = {
        sub: x.sub || 'اسم المادة',
        cl: x.cl || '',
        cls: x.cls || '',
        shared: sharedTeachers.length > 0,
        sharedWith: sharedTeachers
      };
    });

    db.schoolScheduleMeta = {
      importedAt: new Date().toLocaleString('ar-OM'),
      rows: rows.length,
      teachers: [...new Set(rows.map(x => x.teacher))].length,
      sharedLessons: Object.values(sharedMap).filter(set => set.size > 1).length
    };

    save();
  },


  renderImportPreview(rows) {
    const box = $('schoolSchedulePreview');
    if (!box) return;
    box.innerHTML = `
      <div class="overflow-x-auto rounded-2xl border border-slate-200">
        <table class="w-full border-collapse text-sm text-right">
          <thead>
            <tr class="bg-slate-50 text-slate-700 font-bold border-b border-slate-200">
              <th class="p-3">المعلم</th>
              <th class="p-3">اليوم</th>
              <th class="p-3 text-center">الحصة</th>
              <th class="p-3">المادة</th>
              <th class="p-3">الفصل</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            ${rows.map(x => `
              <tr class="hover:bg-slate-50/50">
                <td class="p-3 font-semibold text-slate-800">${esc(x.teacher)}</td>
                <td class="p-3 text-slate-600">${esc(x.day)}</td>
                <td class="p-3 text-center font-bold text-slate-700">${x.period}</td>
                <td class="p-3 text-slate-700">${esc(x.sub)}</td>
                <td class="p-3 text-slate-600">${esc(x.cl)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      ${rows.length >= 40 ? '<p class="text-xs text-slate-400 mt-3 font-medium">تم عرض أول 40 صفاً فقط للمعاينة السريعة.</p>' : ''}
    `;
  },

  renderSchoolPreview() {
    const box = $('schoolSchedulePreview');
    if (!box) return;
    const rows = [];
    db.teachers.forEach(t => DAYS.forEach(d => PERIODS.forEach(p => {
      const l = lesson(t.id, d, p);
      if (l.sub || l.cl) rows.push({ teacher: t.name, day: d, period: p, sub: l.sub, cl: l.cl });
    })));
    let headerInfo = '';
    if (db.schoolScheduleMeta) {
      headerInfo = `<div class="mb-4 text-sm font-semibold text-slate-600 bg-slate-50 p-4 rounded-2xl border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
        <span>📅 آخر استيراد: <b class="text-slate-900">${esc(db.schoolScheduleMeta.importedAt)}</b></span>
        <span>👨‍🏫 عدد المعلمين: <b class="text-emerald-600">${db.schoolScheduleMeta.teachers}</b></span>
        <span>📊 إجمالي الحصص: <b class="text-slate-900">${db.schoolScheduleMeta.rows}</b></span>
      </div>`;
    } else {
      headerInfo = '<div class="mb-4 text-sm text-slate-400 font-medium">لم يتم رفع جدول عام بعد. يمكنك رفع ملف الجدول (Excel أو PDF أو XML) للبدء.</div>';
    }
    box.innerHTML = headerInfo + (rows.length ? `<div class="mt-4"><h4 class="font-bold text-slate-800 mb-3 text-sm">عينة من بيانات الجدول العام:</h4></div>` : '');
    if (rows.length) {
      const grouped = {};
      rows.forEach(r => {

                  <input type="checkbox" class="abs-teacher-check w-4 h-4 accent-emerald-600" value="${t.id}" ${dr && dr.absentIds.includes(t.id) ? 'checked' : ''} onchange="App.buildAbsenceDraft()">
                  <span class="flex-1 text-sm font-semibold">${esc(t.name)}</span>
                  <span class="abs-badge hidden text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-50 text-rose-700" data-tname="${esc(t.name)}">غائب مسجّل</span>
                  <span class="text-[11px] text-slate-400">${db.cnt[t.id]||0}/${t.quota||3} (${(t.quota||0) > 0 ? Math.min(100, Math.round(((db.cnt[t.id]||0)/(t.quota||3))*100)) : 0}%)</span>

  // حفظ المسودة (المعلمون الغائبون + البدلاء) لتبقى ظاهرة عند العودة لصفحة الغياب
  saveAbsDraft() {
    const rows = window.currentPreviewItems || [];
    const ids = this.getSelectedAbsentIds();
    const editing = db.absDraft?.editing ? { editing: true, backup: db.absDraft.backup } : null;
    const next = (ids.length || editing) ? {
      date: editing ? db.absDraft.date : ($('date')?.value || localISODate()),
      absentIds: ids,
      picks: Object.fromEntries(rows.filter(r => r.selectedTeacherId || r.selfManaged).map(r => [`${r.absentId}|${r.period}`, r.selfManaged ? 'self' : r.selectedTeacherId])),
      ...(editing || {})
    } : null;
    if (JSON.stringify(next) === JSON.stringify(db.absDraft || null)) return;
    db.absDraft = next;
    save();
  },

  renderRegisteredAbsences() {
    const box = $('registeredAbsences');
    if (!box) return;
    const iso = $('date')?.value;
    const list = (db.log || []).filter(x => x.date === iso);
    const editingHere = db.absDraft?.editing && db.absDraft.date === iso;
    const banner = editingHere ? `
      <div class="rounded-2xl border border-indigo-200 bg-indigo-50 p-4 mb-3 flex flex-wrap items-center justify-between gap-2">
        <b class="text-indigo-900">✏️ وضع تعديل التوزيع المعتمد ليوم ${dmy(iso)} — عدّل البدلاء ثم اضغط «اعتماد التوزيع».</b>
        <button onclick="App.cancelEditDistribution()" class="bg-white border border-indigo-300 text-indigo-700 hover:bg-indigo-100 px-3 py-2 rounded-xl text-xs font-semibold">↩ إلغاء التعديل واستعادة المعتمد</button>
      </div>` : '';
    if (!list.length) { box.innerHTML = banner; return; }
    const groups = {};
    list.forEach(x => (groups[x.absent] ||= []).push(x));
    box.innerHTML = banner + `
      <div class="rounded-2xl border border-emerald-200 bg-emerald-50/50 p-4">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <b class="text-emerald-900">✅ الغياب المعتمد ليوم ${dmy(iso)} — ${esc(printDayName(list[0].day))} (${Object.keys(groups).length} غائب)</b>
          <div class="flex gap-2">
            <button onclick="App.editCommittedForDate('${iso}')" class="bg-white border border-indigo-300 text-indigo-700 hover:bg-indigo-50 px-3 py-2 rounded-xl text-xs font-semibold">✏️ تعديل التوزيع للجميع</button>
            ${waConfigured() ? `<button onclick="App.waSendBulkForDate('${iso}')" class="bg-white border border-emerald-300 text-emerald-700 hover:bg-emerald-100 px-3 py-2 rounded-xl text-xs font-semibold">📲 إرسال واتساب للجميع</button>` : ''}
            <button onclick="App.printReserveForDate('${iso}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-xl text-xs font-semibold">🖨️ طباعة كشف الاحتياط</button>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          ${Object.entries(groups).map(([name, rows]) => `
            <div class="bg-white border border-emerald-100 rounded-xl p-3">
              <div class="font-bold text-slate-800 mb-1">${esc(name)}</div>
              ${rows.sort((a, b) => a.period - b.period).map(r => {
                const subT = db.teachers.find(tt => tt.name === r.substitute);
                const sentAlready = subT && this.waAlreadySent(subT.id, iso, r.period);
                return `<div class="flex items-center justify-between gap-2 text-xs text-slate-600 py-0.5">
                  <span>الحصة ${r.period} — ${esc(r.subject)}${r.className ? ' (' + esc(r.className) + ')' : ''} ← <b class="text-indigo-700">${esc(r.substitute)}</b></span>
                  ${waConfigured() ? (sentAlready
                    ? `<span class="text-slate-400 shrink-0">✓ أُرسلت</span>`
                    : `<button onclick="App.waSendRowRegistered('${iso}', ${JSON.stringify(r.substitute)}, ${r.period}, ${JSON.stringify(r.className || '')})" class="shrink-0 bg-white border border-emerald-300 text-emerald-700 hover:bg-emerald-100 px-2 py-0.5 rounded-lg font-semibold">📲</button>`
                  ) : ''}
                </div>`;
              }).join('')}
            </div>`).join('')}
        </div>
      </div>`;
  },

  // إرسال فردي لصف واحد في مسودة التوزيع الحالية (قبل أو بعد الاعتماد)، مع تحديث العرض بعد الإرسال
  async waSendRowDraft(teacherId, rowIndex) {
    const r = (window.currentPreviewItems || [])[rowIndex];
    const t = db.teachers.find(tt => tt.id == teacherId);
    if (!r || !t) return;
    await this.waSendTemplate(t, { date: dmy(r.date), day: r.day, period: r.period, className: r.className, isoDate: r.date });
    this.renderAbsenceDraft();
  },

  // يرسل رسالة واتساب لكل معلم بديل مُسنَد حاليًا في مسودة التوزيع (قبل أو بعد الاعتماد)، ويتخطى من سبق إرساله لنفس اليوم/الحصة
  async waSendCurrentDraft() {
    const rows = (window.currentPreviewItems || []).filter(r => r.selectedTeacherId);
    if (!rows.length) { this.alert('لا توجد حصص مُسندة لمعلمين بعد. وزّع الحصص أولًا.'); return; }
    let sent = 0, already = 0, noPhone = 0, failed = 0;
    for (const r of rows) {
      const t = db.teachers.find(tt => tt.id == r.selectedTeacherId);
      const status = await this.waSendTemplate(t, { date: dmy(r.date), day: r.day, period: r.period, className: r.className, isoDate: r.date }, true);
      if (status === 'sent') sent++; else if (status === 'already_sent') already++; else if (status === 'no_phone') noPhone++; else if (status === 'error') failed++;
    }
    this.renderAbsenceDraft();
    this.alert(`تم إرسال ${sent} رسالة.` + (already ? ` ${already} أُرسلت مسبقًا فلم تتكرر.` : '') + (noPhone ? ` ${noPhone} بلا رقم هاتف.` : '') + (failed ? ` فشل إرسال ${failed}.` : ''));
  },

  // يرسل رسالة واتساب لكل بديل اعتُمد لغياب هذا التاريخ، ويتخطى من سبق إرساله لنفس اليوم/الحصة
  async waSendBulkForDate(iso) {
    const list = (db.log || []).filter(x => x.date === iso);
    if (!list.length) return;
    const dayName = printDayName(list[0].day);
    let sent = 0, already = 0, noPhone = 0, failed = 0;
    for (const x of list) {
      const t = db.teachers.find(tt => tt.name === x.substitute);
      const status = await this.waSendTemplate(t, { date: dmy(iso), day: dayName, period: x.period, className: x.className, isoDate: iso }, true);
      if (status === 'sent') sent++; else if (status === 'already_sent') already++; else if (status === 'no_phone') noPhone++; else if (status === 'error') failed++;
    }
    this.renderRegisteredAbsences();
    this.alert(`تم إرسال ${sent} رسالة.` + (already ? ` ${already} أُرسلت مسبقًا فلم تتكرر.` : '') + (noPhone ? ` ${noPhone} بلا رقم هاتف.` : '') + (failed ? ` فشل إرسال ${failed}.` : ''));
  },

  // إرسال فردي لمعلم واحد من قائمة الغياب المعتمد (بعد الاعتماد)
  async waSendRowRegistered(iso, substituteName, period, className) {
    const t = db.teachers.find(tt => tt.name === substituteName);
    const dayName = printDayName((db.log.find(x => x.date === iso) || {}).day || '');
    if (!t) return;
    await this.waSendTemplate(t, { date: dmy(iso), day: dayName, period, className, isoDate: iso });
    this.renderRegisteredAbsences();
  },

  // فتح التوزيع المعتمد ليوم معيّن للتعديل: تُسحب الحصص مؤقتًا من الأرشيف وتُحمَّل في المسودة، مع نسخة احتياطية للاستعادة
  editCommittedForDate(iso) {
    const entries = (db.log || []).filter(x => x.date === iso);
    if (!entries.length) return;
    if (db.absDraft?.editing && db.absDraft.date !== iso) { this.alert('أنهِ أو ألغِ التعديل الجاري أولًا.'); return; }
    this.confirm('سيُفتح توزيع هذا اليوم للتعديل لجميع المعلمين. يمكنك تغيير أي بديل ثم اعتماد التوزيع من جديد، أو إلغاء التعديل لاستعادة المعتمد كما كان. هل تريد المتابعة؟', () => {
      const absentIds = [...new Set(entries.map(e => (db.teachers.find(t => t.name === e.absent) || {}).id).filter(Boolean))];
      const picks = {};
      entries.forEach(e => {
        const at = db.teachers.find(t => t.name === e.absent);
        if (!at) return;
        if (e.substitute === 'إدارة ذاتية') { picks[`${at.id}|${e.period}`] = 'self'; return; }
        const st = db.teachers.find(t => t.name === e.substitute);
        if (st) picks[`${at.id}|${e.period}`] = st.id;
      });
      db.absDraft = { date: iso, absentIds, picks, editing: true, backup: entries.map(e => ({ ...e })) };
      db.log = db.log.filter(x => x.date !== iso);
      entries.forEach(e => {
        const st = db.teachers.find(t => t.name === e.substitute);
        if (st) db.cnt[st.id] = Math.max(0, (db.cnt[st.id] || 0) - 1);
      });
      save();
      this.page('absence');
    }, 'تعديل التوزيع للجميع');
  },

  cancelEditDistribution() {
    const d = db.absDraft;
    if (!d?.editing) return;

  buildAbsenceDraft(noSave) {
    const date = $('date')?.value || localISODate();
    const day = dayNameFromISO(date) || $('day')?.value || 'الأحد';
    if ($('day') && dayNameFromISO(date)) $('day').value = day;

    const ids = window.absWeekend ? [] : this.getSelectedAbsentIds();
    const old = window.currentPreviewItems || [];
    const rows = [];

    ids.forEach(absid => {
      const teacher = db.teachers.find(t => t.id == absid);
      if (!teacher) return;
      PERIODS.forEach(p => {
        const l = lesson(absid, day, p);
        if (l.sub || l.cl) {
          // لا تُعاد معالجة حصة سبق اعتمادها لهذا المعلم في هذا التاريخ (لمنع إعادة توزيع معلمين سابقين عند إضافة غياب جديد)
          const alreadyCommitted = (db.log || []).some(x => x.date === date && x.absent === teacher.name && +x.period === p);
          if (alreadyCommitted) return;
          const oldRow = old.find(x => x.absentId == absid && x.period == p && x.day == day);
          rows.push({
            absentId: absid,
            absentName: teacher.name,
            day,
            date,
            period: p,
            subject: l.sub || 'اسم المادة',
            className: l.cl || l.cls || '',
            selectedTeacherId: oldRow?.selectedTeacherId || null,
            selfManaged: oldRow?.selfManaged || false,
            scoredList: [],
            status: oldRow?.selectedTeacherId ? 'تم التوزيع' : 'غير موزعة'
          });
        }
      });
    });

    window.currentPreviewItems = rows;

    if ($('absCount')) $('absCount').textContent = `${this.getSelectedAbsentIds().length} محدد`;
    this.renderAbsenceDraft();
    if (noSave !== true) this.saveAbsDraft();
  },
